<!doctype html><html lang="nl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Christmas Control Center</title><style>
body{background:#14241e;color:#f2f8f3;font:16px system-ui;margin:0;padding:24px}main{max-width:900px;margin:auto}a{color:#b8e9cf}article{border:1px solid #52705e;border-radius:14px;padding:16px;margin:12px 0;display:flex;gap:12px;flex-wrap:wrap;align-items:center}h2{width:100%;font-size:18px;margin:0}button,input{font:inherit}button{padding:8px 14px;border:0;border-radius:8px;cursor:pointer}button:disabled{opacity:.5}small{color:#c5dbcf}#status{min-height:2em}</style><main><a href="../">← Christmas Control Center</a><h1 id="title"></h1><p>Gebruik de bestaande Home Assistant-integratie. Selecteer hieronder de lampen van dit merk. De selectie wordt in deze browser bewaard.</p><button id="refresh">Vernieuwen</button><p id="status" role="status"></p><section id="lights"></section></main><script>
const brand=location.pathname.split('/').pop(),key='christmas-provider-'+brand;
document.getElementById('title').textContent=brand==='hue'?'Philips Hue':'Govee';
const status=document.getElementById('status'),root=document.getElementById('lights');
let selected=new Set(JSON.parse(localStorage.getItem(key)||'[]'));
async function api(path,body){const r=await fetch('../'+path,body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{cache:'no-store'});if(!r.ok)throw Error(await r.text());return r.json()}
function el(tag,text){let n=document.createElement(tag);if(text)n.textContent=text;return n}
async function load(){try{let list=await api('provider-lights');root.replaceChildren();list.sort((a,b)=>Number(selected.has(b.entity))-Number(selected.has(a.entity)));for(const light of list){let card=el('article'),name=el('h2',light.name),check=el('input');check.type='checkbox';check.checked=selected.has(light.entity);check.setAttribute('aria-label','Selecteer '+light.name);check.onchange=()=>{check.checked?selected.add(light.entity):selected.delete(light.entity);localStorage.setItem(key,JSON.stringify([...selected]));load()};card.append(name,check,el('small',light.entity+' · '+light.state));if(check.checked){const unavailable=['unavailable','unknown'].includes(light.state);async function send(action,extra={}){try{await api('provider-control',{entity:light.entity,action,...extra});status.textContent='Opdracht verzonden';await load()}catch(e){status.textContent=e.message}}for(const [label,action] of [['Aan','turn_on'],['Uit','turn_off']]){const b=el('button',label);b.disabled=unavailable;b.onclick=()=>send(action);card.append(b)}if(light.modes.some(m=>!['onoff','unknown'].includes(m))){let range=el('input');range.type='range';range.min=1;range.max=100;range.value=50;range.disabled=unavailable;range.setAttribute('aria-label','Helderheid');range.onchange=()=>send('turn_on',{brightness_pct:Number(range.value)});card.append(range)}if(light.modes.some(m=>['rgb','rgbw','rgbww','hs','xy'].includes(m))){let color=el('input');color.type='color';color.disabled=unavailable;color.setAttribute('aria-label','Kleur');color.onchange=()=>send('turn_on',{rgb_color:color.value.slice(1).match(/../g).map(x=>parseInt(x,16))});card.append(color)}}root.append(card)}if(!list.length)status.textContent='Geen lichtentiteiten gevonden.'}catch(e){status.textContent=e.message}}
document.getElementById('refresh').onclick=load;load();
</script></html>
