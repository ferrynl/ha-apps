name: Assemble Hue product catalog
on:
  push:
    branches: [feature/hue-transparent-product-catalog]
permissions:
  contents: write
jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install Pillow==12.2.0
      - run: python scripts/assemble_hue_catalog.py
      - name: Record verified source photos
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add twinkly_beta/images/HUE
          if ! git diff --cached --quiet; then
            git commit -m "Add verified transparent Hue photographs and model index"
            git push origin HEAD
          fi
