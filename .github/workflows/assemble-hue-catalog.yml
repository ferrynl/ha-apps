name: Assemble Hue product catalog
on:
  push:
    branches: [feature/hue-transparent-product-catalog]
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  catalog:
    if: github.event_name == 'push' || (github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feature/hue-transparent-product-catalog')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: command -v convert || (sudo apt-get update && sudo apt-get install -y imagemagick)
      - run: pip install Pillow==12.2.0
      - run: python scripts/assemble_hue_catalog.py
      - name: Record verified source photos
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add twinkly_beta/images/HUE
          if ! git diff --cached --quiet; then
            git commit -m "Add verified transparent Hue photographs and model index"
            git push origin HEAD
          fi
