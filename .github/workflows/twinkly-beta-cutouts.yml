name: Transparante Twinkly-foto’s maken en testen
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
permissions:
  contents: write
jobs:
  cutouts:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'beta/twinkly-transparent-photos'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'rembg[cpu]==2.0.73'
      - run: python scripts/twinkly_beta_cutouts.py
        env:
          OMP_NUM_THREADS: '2'
      - run: docker build -t twinkly-beta-cutouts twinkly_beta
      - name: Bewaar de geteste PNG-bestanden
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add twinkly_beta/product_photos
          git commit -m "Voeg geteste transparante Twinkly-productfoto’s toe"
          git push origin HEAD:refs/heads/beta/twinkly-transparent-photos
