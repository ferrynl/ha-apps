name: Twinkly Beta tests
on:
  pull_request:
    branches: [main]
    paths: ['twinkly_beta/**', '.github/workflows/twinkly-beta-bundled-previews.yml']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test twinkly_beta/test_network_map.cjs
      - run: docker build -t twinkly-beta twinkly_beta
